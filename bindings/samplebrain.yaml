# Samplebrain OSC bindings (user-editable)
#
# This bridge speaks a stable "house API" (/rig/*) and *optionally* forwards
# selected controls into Samplebrain.
#
# Set `address: null` to disable any mapping. The bridge will run happily with
# everything unbound — you can still drive TouchDesigner / Processing / Reaper.
#
# How to discover addresses:
# - docs/samplebrain-discovery.md
#
# Types:
# - f : float
# - i : int
# - s : string

macros:
  # Two "Morph Space" macro axes we use everywhere.
  energy:
    address: null
    type: f
  chaos:
    address: null
    type: f

  # Optional additional macro axes (keep or delete as you like)
  density:
    address: null
    type: f
  drift:
    address: null
    type: f

params:
  # Add any named parameters you want to forward using /rig/param "<name>" <value>
  # Example:
  #   novelty:
  #     address: "/samplebrain/novelty"
  #     type: f
  {}
